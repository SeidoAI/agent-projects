# Default lint thresholds. Projects override via `project.yaml.lint_config`
# (per-lint, per-key). The package-shipped floor lives here; the
# loader in `tripwire.core.validator.lint._thresholds` reads this
# file at import time and exposes the dicts under their canonical
# names (DEFAULT_THRESHOLDS, KIND_OVERRIDES).
#
# Schema: `{lint_name: {threshold_name: value}}`. Adding a new
# threshold means a new sub-key, not a model migration.

default_thresholds:
  concept_name_prose:
    # Min number of issues that must use the node name as prose
    # (without a [[ref]]) before the lint warns.
    min_issues: 2

  semantic_coverage:
    # Min `[[node-id]]` references in the AC section per active issue.
    # Defaults to 0 (off) — projects opt in via lint_config because the
    # convention of putting concept refs in AC items is project-policy,
    # not universal.
    min_ac_node_refs: 0

  mega_issue:
    # Warn when an issue has >= this many child issues OR sessions.
    max_children: 8
    max_sessions: 6

  node_ratio:
    # Warn when nodes-per-active-issue ratio falls outside this band.
    min_ratio: 0.10
    max_ratio: 5.0

# Per-project-kind overrides on top of `default_thresholds`. Missing
# kinds fall through to the defaults; missing keys inside a kind also
# fall through. Project-team can layer their own values via
# `project.yaml.lint_config`.
kind_overrides:
  library:
    # Libraries tend to have fewer issues per concept node.
    node_ratio:
      min_ratio: 0.5
      max_ratio: 10.0
  framework:
    node_ratio:
      min_ratio: 0.5
      max_ratio: 10.0
